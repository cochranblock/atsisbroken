# Unlicense — public domain — cochranblock.org
# atsisbroken — the browser for filling job applications. Single Rust binary,
# Servo-derived engine, no Chrome dependency, no extension. The browser IS
# the product. Per-character human-like input, per-domain anti-fingerprint
# controls, audit-passable verbatim-source free-form composition.
# Stack: html5ever + stylo + WebRender + SpiderMonkey (via Servo) for the
# engine; winit + wgpu for window + render surface; reqwest + rustls for
# network; the existing classifier + Profile + GitHub source + correction
# overlay live unchanged inside the browser as the "brain."
# Architecture: single Rust binary, single crate, cross-compiled. The user's
# model is the only model.
# Contributors: GotEmCoach, KOVA, Claude Opus 4.7

[workspace]
members = ["android"]
resolver = "2"

[package]
name = "atsisbroken"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["Michael Cochran <mcochran@cochranblock.org>"]
description = "ATS is broken. Browser autopilot that fills job applications using a model the user trains locally from their own resume. Single binary. No cloud. No accounts. Unlicense."
license = "Unlicense"
repository = "https://github.com/cochranblock/cochranblock/atsisbroken"
homepage = "https://simplify.cochranblock.org"
readme = "README.md"
keywords = ["ats", "job-application", "autofill", "resume", "local-first"]
categories = ["command-line-utilities"]
include = [
    "src/**/*",
    "assets/seed-corpus.jsonl",
    "Cargo.toml",
    "UNLICENSE",
    "README.md",
]

[lib]
name = "atsisbroken"
path = "src/lib.rs"

[[bin]]
name = "atsisbroken"
path = "src/main.rs"

[features]
default = ["tui", "gui"]
# Optional terminal UI. ratatui + crossterm (~250 KB compiled). Drop with
# `--no-default-features` for the leanest cross-compiled releases.
tui = ["dep:ratatui", "dep:crossterm"]
# The browser shell. Named `gui` (not `browser`) because kova-engine has
# its own `browser` feature for a different purpose; Cargo's
# command-line `--features` matching is workspace-wide and a name
# collision means `--features browser` would also enable kova's
# core-graphics + image deps which don't compile on Linux. `gui` is
# atsisbroken-specific and avoids the collision. Window via winit,
# render surface via wgpu, HTML/CSS/JS engine wired in below. This is
# the product surface.
gui = [
    "dep:winit",
    "dep:wgpu",
    "dep:raw-window-handle",
    "dep:pollster",
    "dep:bytemuck",
    "dep:html5ever",
    "dep:markup5ever_rcdom",
    "dep:glyphon",
]

[dependencies]
# kova-engine was a path dep used only by the now-retired
# ats_fixtures re-export + the legacy CDP e2e test (deleted in
# 7a8bd0b). atsisbroken-the-browser carries its own engine
# (winit + wgpu + html5ever + glyphon, with stylo + mozjs to
# come) — no kova dep needed. If a future commit wants kova's
# inference layer for an in-app classifier, it gets re-added
# at that point.
# Chromium DevTools Protocol client. Pure Rust. Kept while the
# legacy CDP path exists as a fallback strategy; retires when
# the new browser engine renders real ATS pages.
chromiumoxide  = { version = "0.7", default-features = false, features = ["tokio-runtime"] }
# Async runtime for the CDP client + trainer + inference loop.
tokio          = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
futures        = "0.3"
# CLI + serde + errors.
clap           = { version = "4", features = ["derive"] }
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
toml           = "0.8"
anyhow         = "1"
thiserror      = "2"
# HTTP client for Phase I (`connect-github` / `sync-github`). Pulls
# transitively via chromiumoxide already, so adding it as a direct
# dep is "free" in binary size — we just declare the features
# atsisbroken's code relies on. rustls-tls reuses the rustls already
# in the dep graph for tokio-tungstenite (no native-tls / OpenSSL).
reqwest        = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
# Base64 decoder for GitHub's /repos/{owner}/{repo}/readme response
# (content is base64-encoded). Already transitively present.
base64         = "0.22"
# TUI deps — versions pinned to match kova's TUI feature for workspace parity.
ratatui        = { version = "0.29", optional = true }
crossterm      = { version = "0.28", optional = true }

# Browser shell deps. The window + render surface stack is winit + wgpu;
# this is the same stack Servo's WebRender uses internally and what every
# Rust-native UI framework (egui, iced, dioxus-blitz) standardizes on.
# We start with html5ever for HTML parsing and markup5ever_rcdom for the
# Servo-style DOM representation — same crates Servo uses, so when we
# wire in stylo + spidermonkey-via-mozjs the DOM hand-off is direct.
winit              = { version = "0.30", optional = true }
wgpu               = { version = "23", optional = true, default-features = false, features = ["wgsl", "metal", "dx12"] }
raw-window-handle  = { version = "0.6", optional = true }
pollster           = { version = "0.4", optional = true }
bytemuck           = { version = "1", optional = true, features = ["derive"] }
html5ever          = { version = "0.29", optional = true }
markup5ever_rcdom  = { version = "0.5.0-unofficial", optional = true }
# Text rendering on the wgpu surface. Glyphon wraps cosmic-text +
# fontdb for Unicode-correct shaping and uses a glyph atlas on
# wgpu. Pinned to 0.7 for wgpu-23 compatibility (each glyphon
# minor tracks one wgpu major).
glyphon            = { version = "0.7", optional = true }

[dev-dependencies]
# Snapshot testing for internal-page text bodies. Each page's output
# is a fixture file under src/browser/snapshots/; CI fails when a
# page's text drifts unexpectedly. Running `cargo insta accept`
# bumps the fixtures.
insta              = "1.43"
# Property-based fuzzing for the URL parser. Generates random byte
# sequences and asserts the parser doesn't panic, doesn't loop, and
# round-trips valid input.
proptest           = "1.7"



# ─── DIAMOND RUST BINARY ARCHITECTURE ───────────────────────────────
# Canonical: https://cochranblock.org/diamond-profile.toml
#
# Speed-Diamond for the inference hot path on a developer machine:
#   cargo build --profile=diamond
#
# Size-Diamond for cross-compiled GitHub Releases artifacts:
#   cargo build --profile=diamond-edge --target=x86_64-apple-darwin
#   cargo build --profile=diamond-edge --target=aarch64-apple-darwin
#   cargo build --profile=diamond-edge --target=x86_64-unknown-linux-gnu
#   cargo build --profile=diamond-edge --target=x86_64-pc-windows-msvc

[profile.diamond]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false
debug = false
incremental = false
split-debuginfo = "off"

[profile.diamond-edge]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false
debug = false
incremental = false
split-debuginfo = "off"
