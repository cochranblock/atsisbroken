[book]
title = "atsisbroken"
description = "ATS scraper and job application automation. Breaks applicant tracking systems so candidates can actually apply."
authors = ["Michael Cochran"]
language = "en"
src = "src"

[output.html]
git-repository-url = "https://github.com/cochranblock/atsisbroken"
edit-url-template = "https://github.com/cochranblock/atsisbroken/edit/main/docs/src/{path}"
site-url = "/atsisbroken/"
additional-css = ["theme/custom.css"]
additional-js = ["theme/force-theme.js"]
default-theme = "coal"
preferred-dark-theme = "coal"
no-section-label = true

[output.html.fold]
enable = true
level = 1
