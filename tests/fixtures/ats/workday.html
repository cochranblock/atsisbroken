<!doctype html>
<!-- Mock Workday-style application form. Notable: late hydration, label-as-span,
     aria-labels carry the real meaning. SPDX-License-Identifier: Unlicense -->
<html lang="en">
<head><meta charset="utf-8"><title>Workday — My Information</title>
<style>
body{font:13px/1.5 'Helvetica Neue',sans-serif;background:#f1f1f1;margin:0}
.wd-container{background:#fff;max-width:720px;margin:30px auto;padding:32px;border:1px solid #e0e0e0}
h2{margin-top:0;font-size:18px;color:#0070d2}
.wd-form-row{margin:14px 0;display:flex;flex-direction:column}
.wd-form-row span.wd-label{font-size:12px;font-weight:600;color:#444;margin-bottom:4px}
input{width:100%;border:1px solid #b8b8b8;padding:6px 8px;font-size:13px;box-sizing:border-box}
button{background:#0070d2;color:#fff;border:0;padding:8px 28px;font-size:13px;cursor:pointer}
</style></head>
<body>
<div class="wd-container">
<h2>My Information</h2>
<form>
  <div class="wd-form-row">
    <span class="wd-label">Legal Name (First)</span>
    <input type="text" name="legalNameFirst" id="lf" data-automation-id="legalNameSection_firstName" aria-label="First Name" required>
  </div>
  <div class="wd-form-row">
    <span class="wd-label">Legal Name (Last)</span>
    <input type="text" name="legalNameLast" id="ll" data-automation-id="legalNameSection_lastName" aria-label="Last Name" required>
  </div>
  <div class="wd-form-row">
    <span class="wd-label">Email Address</span>
    <input type="email" name="primaryEmail" id="em" data-automation-id="email" aria-label="Email" required>
  </div>
  <div class="wd-form-row">
    <span class="wd-label">Phone Device Type</span>
    <select name="phoneDeviceType"><option>Mobile</option><option>Home</option></select>
  </div>
  <div class="wd-form-row">
    <span class="wd-label">Phone Number</span>
    <input type="tel" name="phoneNumber" id="ph" aria-label="Phone Number" required>
  </div>
  <div class="wd-form-row">
    <span class="wd-label">Address Line 1</span>
    <input type="text" name="addressLine1" id="ad1" aria-label="Street Address">
  </div>
  <div class="wd-form-row">
    <span class="wd-label">City</span>
    <input type="text" name="city" id="ct" aria-label="City">
  </div>
  <div class="wd-form-row">
    <span class="wd-label">Postal Code</span>
    <input type="text" name="postalCode" id="zip" aria-label="Zip Code">
  </div>
  <div class="wd-form-row">
    <span class="wd-label">LinkedIn (Optional)</span>
    <input type="url" name="websiteLinkedIn" id="wd_lk" aria-label="LinkedIn URL">
  </div>
  <div class="wd-form-row">
    <span class="wd-label">Are you legally authorized to work in this country?</span>
    <select name="workAuth" id="wa" aria-label="work authorization"><option>Yes</option><option>No</option></select>
  </div>
  <button type="submit">Save and Continue</button>
</form>
</div>
</body></html>
