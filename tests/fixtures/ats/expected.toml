# Expected classifier output per fixture. Used by tests/ats_e2e.rs.
# Each [[fixture]] table lists every form field in the corresponding
# .html file with its (name|id) selector and the predicted_field_key
# the Rust classifier should produce. Out-of-vocab fields list ""
# explicitly — the classifier MUST emit empty (skip), never invent.

[[fixture]]
file = "greenhouse.html"
expectations = [
    { id = "first_name",     expected = "full_name" },
    { id = "last_name",      expected = "full_name" },
    { id = "email",          expected = "email" },
    { id = "phone",          expected = "phone" },
    { id = "urls_linkedin",  expected = "linkedin" },
    { id = "urls_github",    expected = "github" },
    { id = "urls_portfolio", expected = "website" },
    { id = "visa",           expected = "work_authorization" },
    { id = "why",            expected = "freetext" },
    { id = "salary",         expected = "" },
]

