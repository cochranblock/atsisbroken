<!doctype html>
<!-- Mock Greenhouse-style application form. SPDX-License-Identifier: Unlicense -->
<html lang="en">
<head><meta charset="utf-8"><title>Acme Inc — Apply for Senior Engineer</title>
<style>
body{font:14px/1.5 system-ui;max-width:680px;margin:40px auto;padding:0 16px;color:#24292f}
h1{font-size:22px;margin:0 0 6px}
.meta{color:#57606a;margin:0 0 30px}
.field{margin:18px 0}
label{display:block;font-weight:600;margin-bottom:6px;font-size:13px}
input,textarea,select{width:100%;padding:8px;border:1px solid #d0d7de;border-radius:6px;font:inherit;box-sizing:border-box}
.req::after{content:"*";color:#d1242f;margin-left:4px}
.row{display:flex;gap:12px}.row>div{flex:1}
button{background:#2da44e;color:#fff;border:0;padding:10px 16px;border-radius:6px;font-weight:600;margin-top:20px}
</style></head>
<body>
<h1>Senior Software Engineer</h1>
<p class="meta">Acme Inc · San Francisco, CA · Full-time</p>
<form id="app">
  <div class="row">
    <div class="field"><label for="first_name" class="req">First Name</label>
      <input type="text" id="first_name" name="first_name" required></div>
    <div class="field"><label for="last_name" class="req">Last Name</label>
      <input type="text" id="last_name" name="last_name" required></div>
  </div>
  <div class="field"><label for="email" class="req">Email</label>
    <input type="email" id="email" name="email" placeholder="you@example.com" required></div>
  <div class="field"><label for="phone" class="req">Phone</label>
    <input type="tel" id="phone" name="phone" placeholder="+1 (555) 555-5555" required></div>
  <div class="field"><label for="urls_linkedin">LinkedIn Profile</label>
    <input type="url" id="urls_linkedin" name="urls[linkedin]" placeholder="https://linkedin.com/in/..."></div>
  <div class="field"><label for="urls_github">GitHub URL</label>
    <input type="url" id="urls_github" name="urls[github]" placeholder="https://github.com/..."></div>
  <div class="field"><label for="urls_portfolio">Portfolio</label>
    <input type="url" id="urls_portfolio" name="urls[portfolio]"></div>
  <div class="field"><label for="visa">Will you now or in the future require visa sponsorship for employment?</label>
    <select id="visa" name="visa_sponsorship"><option value="">--</option><option>Yes</option><option>No</option></select></div>
  <div class="field"><label for="why">Why are you interested in this role?</label>
    <textarea id="why" name="cover_letter" rows="5"></textarea></div>
  <div class="field"><label for="salary">Expected annual salary (USD)</label>
    <input type="number" id="salary" name="salary_expectation"></div>
  <button type="submit">Submit Application</button>
</form>
</body></html>
